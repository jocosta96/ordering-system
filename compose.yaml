services:
  postgres:
    image: postgres:14.17
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "ordering" ]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: always

  python:
    command: >
      sh -c "
        alembic revision --autogenerate &&
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 80
      "
    env_file:
      - .env
    build: .
    ports:
      - 80:80
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-db-volume: