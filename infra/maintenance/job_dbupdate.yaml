#update the database tables according to the orm objects
apiVersion: batch/v1
kind: Job
metadata:
  name: job-dbupdate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      volumes:
      - name: migrations-volume
        persistentVolumeClaim:
          claimName: pvc-migrations
      containers:
      - name: database-update
        image: jocosta96/soat-challenge
        volumeMounts:
          - name: migrations-volume
            mountPath: /migrations
        command: ["sh", "-c"]
        args:
          - |
            # Create migrations directory if it doesn't exist
            mkdir -p /migrations/versions
            
            # Set up Alembic environment
            export ALEMBIC_CONFIG=/code/alembic.ini
            
            # Apply migrations
            cd /code
            python infra/scripts/database_migration.py migrate
        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: sec-database
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: sec-database
                key: POSTGRES_PASSWORD
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: sec-database
                key: POSTGRES_DB
          - name: PGADMIN_MAIL
            valueFrom:
              secretKeyRef:
                name: sec-database
                key: PGADMIN_MAIL
          - name: PGADMIN_PW
            valueFrom:
              secretKeyRef:
                name: sec-database
                key: PGADMIN_PW
          - name: POSTGRES_HOST
            valueFrom:
              configMapKeyRef:
                name: cfm-database
                key: POSTGRES_HOST
          - name: DRIVER_NAME
            valueFrom:
              configMapKeyRef:
                name: cfm-database
                key: DRIVER_NAME

