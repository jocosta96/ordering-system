apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-job
  labels:
    app: db-init
spec:
  template:
    metadata:
      labels:
        app: db-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: db-init
        image: jocosta96/soat-challenge
        command: ["sh", "-c"]
        args:
          - |
            cd /code/src
            python scripts/init_db.py --sample-data
        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: sec-database
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: sec-database
                key: POSTGRES_PASSWORD
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: sec-database
                key: POSTGRES_DB
          - name: POSTGRES_HOST
            valueFrom:
              configMapKeyRef:
                name: cfm-database
                key: POSTGRES_HOST
          - name: POSTGRES_PORT
            valueFrom:
              configMapKeyRef:
                name: cfm-database
                key: POSTGRES_PORT
          - name: DRIVER_NAME
            valueFrom:
              configMapKeyRef:
                name: cfm-database
                key: DRIVER_NAME
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m" 