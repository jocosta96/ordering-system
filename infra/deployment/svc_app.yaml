apiVersion: v1
kind: Service
metadata:
  name: svc-app-nodeport
spec:
  type: NodePort
  selector:
    app: dpm-app
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: svc-webhook-nodeport
spec:
  type: NodePort
  selector:
    app: dpm-app
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 30000