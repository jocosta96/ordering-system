apiVersion: v1
kind: Service
metadata:
  name: svc-webhook-nodeport
spec:
  type: NodePort
  selector:
    app: dpm-webhook
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpm-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dpm-webhook
  template:
    metadata:
      labels:
        app: dpm-webhook
    spec:
      containers:
        - name: webhook
          image: jocosta96/soat-challenge
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 60
          env:
            - name: API_PWD
              valueFrom:
                secretKeyRef:
                  name: sec-app
                  key: API_PWD
            - name: API_USER
              valueFrom:
                secretKeyRef:
                  name: sec-app
                  key: API_USER
          resources:
            requests:
              memory: "128Mi"
              cpu: "150m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          command: ["sh", "-c"]
          args:
            - |
              uvicorn webhook.payment:webhook --host 0.0.0.0 --port 8000

