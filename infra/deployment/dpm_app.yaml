apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpm-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dpm-app
  template:
    metadata:
      labels:
        app: dpm-app
    spec:
      volumes:
      - name: migrations-volume
        persistentVolumeClaim:
          claimName: pvc-migrations
      containers:
        - name: app
          image: jocosta96/soat-challenge
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: migrations-volume
              mountPath: /migrations
          readinessProbe:
            httpGet:
              path: /health/db
              port: 8080
            initialDelaySeconds: 60
            failureThreshold: 3
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 60
          env:
            - name: API_PWD
              valueFrom:
                secretKeyRef:
                  name: sec-app
                  key: API_PWD
            - name: API_USER
              valueFrom:
                secretKeyRef:
                  name: sec-app
                  key: API_USER
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sec-database
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sec-database
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: sec-database
                  key: POSTGRES_DB
            - name: PGADMIN_MAIL
              valueFrom:
                secretKeyRef:
                  name: sec-database
                  key: PGADMIN_MAIL
            - name: PGADMIN_PW
              valueFrom:
                secretKeyRef:
                  name: sec-database
                  key: PGADMIN_PW
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: cfm-database
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: cfm-database
                  key: POSTGRES_PORT
            - name: DRIVER_NAME
              valueFrom:
                configMapKeyRef:
                  name: cfm-database
                  key: DRIVER_NAME
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: cfm-database
                  key: DEBUG
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: cfm-database
                  key: LOG_LEVEL
            - name: WEBHOOK_URL
              value: "http://svc-webhook-nodeport:80"
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          command: ["sh", "-c"]
          args:
            - |
              # Start the application
              echo "Starting FastAPI application..."
              exec uvicorn src.main:app --host 0.0.0.0 --port 8080

