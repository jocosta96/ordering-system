apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpm-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dpm-app
  template:
    metadata:
      labels:
        app: dpm-app
    spec:
      containers:
        - name: app
          image: jocosta96/soat-challenge
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /customer/anonymous
              port: 8080
            initialDelaySeconds: 60
            failureThreshold: 3
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 60
          env:
            - name: API_PWD
              valueFrom:
                secretKeyRef:
                  name: sec-app
                  key: API_PWD
            - name: API_USER
              valueFrom:
                secretKeyRef:
                  name: sec-app
                  key: API_USER
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sec-database
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sec-database
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: sec-database
                  key: POSTGRES_DB
            - name: PGADMIN_MAIL
              valueFrom:
                secretKeyRef:
                  name: sec-database
                  key: PGADMIN_MAIL
            - name: PGADMIN_PW
              valueFrom:
                secretKeyRef:
                  name: sec-database
                  key: PGADMIN_PW
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: cfm-database
                  key: POSTGRES_HOST
            - name: DRIVER_NAME
              valueFrom:
                configMapKeyRef:
                  name: cfm-database
                  key: DRIVER_NAME
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          command: ["sh", "-c"]
          args:
            - |
              PYTHONPATH=/code python app/adapter/outbound/repositories/sql/migrations/database_init.py
              uvicorn app.adapter.inbound.webhook.payment:webhook --host 0.0.0.0 --port 8000 &
              uvicorn app.main:app --host 0.0.0.0 --port 8080
